[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocel-healer"
version = "1.5.0"
description = "Detection and LLM-assisted repair of data-quality issues in object-centric event logs (OCEL 2.0)."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "polars",
    "jupyter",
    "ipykernel",
    "marimo>=0.23.14,<0.24",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

# Treat `src` itself as the importable package, so existing imports like
# `from src.detection.error_detection import detect_all` keep working.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
